
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QuickKart Operations Workspace</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: #f3f6fa;
    color: #172b42;
}

header {
    height: 64px;
    background: #10243a;
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
}

.brand {
    font-weight: 700;
    font-size: 19px;
}

.status {
    font-size: 12px;
    color: #c5d8e8;
}

.layout {
    display: flex;
    min-height: calc(100vh - 64px);
}

nav {
    width: 235px;
    background: white;
    border-right: 1px solid #dce4ed;
    padding: 18px 12px;
    flex-shrink: 0;
}

nav small {
    display: block;
    color: #63758a;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 12px;
}

nav button {
    width: 100%;
    display: block;
    text-align: left;
    background: transparent;
    color: #172b42;
    border: 0;
    padding: 13px;
    border-radius: 7px;
    cursor: pointer;
    margin: 3px 0;
    font-size: 14px;
}

nav button.active,
nav button:hover {
    background: #e8f2fb;
    color: #075b9b;
    font-weight: 600;
}

main {
    flex: 1;
    min-width: 0;
    padding: 20px;
}

.heading h1 {
    margin: 0 0 5px;
    font-size: 23px;
}

.heading p {
    margin: 0 0 15px;
    color: #63758a;
    font-size: 13px;
}

.frame {
    background: white;
    border: 1px solid #dce4ed;
    border-radius: 10px;
    overflow: hidden;
}

iframe {
    width: 100%;
    height: calc(100vh - 145px);
    min-height: 620px;
    border: 0;
    display: block;
    background: white;
}

@media (max-width: 760px) {

    .layout {
        display: block;
    }

    nav {
        width: 100%;
        display: flex;
        overflow-x: auto;
        padding: 8px;
        border: 0;
        border-bottom: 1px solid #dce4ed;
    }

    nav small {
        display: none;
    }

    nav button {
        white-space: nowrap;
        width: auto;
    }

    main {
        padding: 12px;
    }

    iframe {
        height: 78vh;
        min-height: 600px;
    }

}

</style>

</head>

<body>

<header>

    <div class="brand">
        QuickKart | Operations Workspace
    </div>

    <div class="status">
        AI-assisted · Human-supervised
    </div>

</header>


<div class="layout">

    <nav>

        <small>WORKSPACE</small>

        <button
            class="active"
            data-page="strategy">
            Strategy dashboard
        </button>

        <button
            data-page="review">
            Investigate & human review
        </button>

        <button
            data-page="monitor">
            Monitoring dashboard
        </button>

    </nav>


    <main>

        <div class="heading">

            <h1 id="pageTitle">
                Strategy dashboard
            </h1>

            <p id="pageDescription">
                Business case, architecture, responsible AI and ROI.
            </p>

        </div>


        <div class="frame">

            <iframe
                id="workspaceFrame"
                src="/dashboard"
                title="QuickKart workspace">
            </iframe>

        </div>

    </main>

</div>


<script>

const pages = {

    strategy: {

        url: "/dashboard",

        title: "Strategy dashboard",

        description:
            "Business case, architecture, responsible AI and ROI."
    },

    review: {

        url: "/review",

        title: "Investigate and human review",

        description:
            "Run the six-agent investigation and record a human approval decision."
    },

    monitor: {

        url: "/operations",

        title: "Monitoring dashboard",

        description:
            "HTTP health, latency, model usage, evaluation, governance and approvals."
    }

};


const frame = document.getElementById(
    "workspaceFrame"
);

const title = document.getElementById(
    "pageTitle"
);

const description = document.getElementById(
    "pageDescription"
);


document.querySelectorAll(
    "nav button"
).forEach(button => {

    button.addEventListener(
        "click",
        () => {

            const page = pages[
                button.dataset.page
            ];

            if (!page) {
                return;
            }

            frame.src = page.url;

            title.textContent = page.title;

            description.textContent =
                page.description;

            document.querySelectorAll(
                "nav button"
            ).forEach(item => {

                item.classList.toggle(
                    "active",
                    item === button
                );

            });

        }
    );

});

</script>

</body>

</html>
